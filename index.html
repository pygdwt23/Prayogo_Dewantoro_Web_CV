<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prayogo Dewantoro | QA Automation Engineer</title>
<meta name="description" content="QA Automation Engineer specializing in Selenium, Playwright and Python.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#31343a;--panel:#2a2d32;--line:#454950;--text:#d8dae0;--muted:#9ea2ab;--green:#39ff14;
--font:"Space Grotesk","Segoe UI",system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-behavior:smooth;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.65;font-size:17px}
button{font:inherit;cursor:pointer}
a{color:inherit}.g{color:var(--green)}.dim{color:var(--muted)}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:4px}
.wrap{max-width:980px;margin:0 auto;padding:0 24px}
.bar{position:fixed;left:0;right:0;top:0;height:3px;background:var(--green);transform-origin:left;transform:scaleX(0);z-index:30}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(49,52,58,.85);backdrop-filter:blur(8px);border-bottom:1px solid transparent}
nav .wrap{display:flex;gap:6px;justify-content:flex-end;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:6px;font-size:15px;transition:color .2s,background .2s}
nav a:hover{color:var(--text)}nav a.on{color:var(--green);background:rgba(57,255,20,.08)}
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:48px;align-items:center;padding:48px 0 84px}
.photo{width:128px;height:128px;border-radius:50%;object-fit:cover;border:3px solid var(--green);display:block;margin:0 0 22px;box-shadow:0 0 0 6px rgba(57,255,20,.12);animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(57,255,20,0)}}
.hero h1{font-size:clamp(40px,7vw,68px);line-height:1.02;margin:0 0 14px;font-weight:700;letter-spacing:-.02em}
.role{font-size:21px;color:var(--green);margin:0 0 20px;min-height:32px}
.hero p.sum{margin:0 0 26px;max-width:46ch}
.cursor{display:inline-block;width:9px;height:1em;background:var(--green);vertical-align:-3px;margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.links{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 18px;border:1px solid var(--green);background:transparent;color:var(--green);text-decoration:none;border-radius:6px;font-weight:500;transition:background .15s,color .15s,transform .15s}
.btn:hover{background:var(--green);color:#1d1f23;transform:translateY(-2px)}
.btn.alt{border-color:var(--line);color:var(--text)}.btn.alt:hover{border-color:var(--green);background:transparent;color:var(--green)}
.run{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px;font-family:var(--mono);font-size:14px;line-height:1.9;overflow-x:auto;min-height:250px}
.row{display:flex;justify-content:space-between;gap:16px;white-space:nowrap;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateX(-8px)}}
.spin{animation:blink 1s steps(1) infinite}
.run hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.rerun{margin-top:12px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 12px;font:13px var(--mono)}
.rerun:hover{color:var(--green);border-color:var(--green)}
section{padding:64px 0;border-top:1px solid var(--line)}
h2{font-size:30px;margin:0 0 28px;font-weight:700;letter-spacing:-.01em}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}.reveal.in{opacity:1;transform:none}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tab{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 16px;transition:all .2s}
.tab:hover{color:var(--text)}.tab.on{background:var(--green);border-color:var(--green);color:#1d1f23;font-weight:500}
.pills{display:flex;flex-wrap:wrap;gap:10px;min-height:120px;align-content:flex-start}
.pill{padding:6px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);animation:pop .35s ease both;transition:border-color .2s,color .2s}
.pill:hover{border-color:var(--green);color:var(--green)}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
.job{border-left:2px solid var(--line);padding:0 0 26px 26px;position:relative}
.job::before{content:"";position:absolute;left:-7px;top:10px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--green)}
.jh{width:100%;text-align:left;background:none;border:0;color:inherit;padding:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.jh h3{margin:0;font-size:21px}.jh .meta{color:var(--muted);font-size:15px}
.chev{color:var(--green);font-size:22px;transition:transform .3s;line-height:1.3}.open .chev{transform:rotate(180deg)}
.col{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}.open .col{grid-template-rows:1fr}
.col>div{overflow:hidden}
.job h4{margin:16px 0 4px;font-size:16px;font-weight:500;color:var(--green)}
.job ul{margin:10px 0 0;padding-left:20px}.job li{margin:4px 0}
.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.proj{--x:50%;--y:50%;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px;transition:transform .25s,border-color .25s;overflow:hidden}
.proj::after{content:"";position:absolute;inset:0;background:radial-gradient(220px circle at var(--x) var(--y),rgba(57,255,20,.14),transparent 70%);opacity:0;transition:opacity .25s;pointer-events:none}
.proj:hover{transform:translateY(-4px);border-color:var(--green)}.proj:hover::after{opacity:1}
.proj h3{margin:0 0 6px;font-size:18px}.proj p{margin:0;color:var(--muted);font-size:15.5px}.stack{color:var(--green);font-size:15px;margin-top:10px;display:block}
.edu{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.edu h3{margin:0 0 10px;font-size:17px;color:var(--green);font-weight:500}
.edu ul{list-style:none;margin:0;padding:0}.edu li{padding:8px 0;border-bottom:1px solid var(--line);transition:padding-left .2s}
.edu li:hover{padding-left:8px}.edu li span{color:var(--muted)}
.contact p{max-width:52ch;margin:0 0 22px}
footer{padding:28px 0 40px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:1px solid var(--green);background:var(--panel);color:var(--green);display:flex;align-items:center;justify-content:center;z-index:25;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:background .15s,color .15s,transform .15s}
.fab:hover{background:var(--green);color:#1d1f23;transform:translateY(-2px)}
@media (max-width:760px){body{font-size:16px}.hero{grid-template-columns:1fr;gap:34px;padding-top:24px}.projects,.edu{grid-template-columns:1fr}nav .wrap{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>

function Reveal({children,d=0}){
 const r=useRef(null);const[v,setV]=useState(false);
 useEffect(()=>{const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){setV(true);o.disconnect()}},{threshold:.12});o.observe(r.current);return()=>o.disconnect()},[]);
 return html`<div ref=${r} className=${'reveal'+(v?' in':'')} style=${{transitionDelay:d+'ms'}}>${children}</div>`}

function Progress(){
 const[p,setP]=useState(0);
 useEffect(()=>{const f=()=>{const h=document.documentElement;setP(h.scrollTop/((h.scrollHeight-h.clientHeight)||1))};addEventListener('scroll',f,{passive:true});f();return()=>removeEventListener('scroll',f)},[]);
 return html`<div className="bar" style=${{transform:`scaleX(${p})`}}></div>`}

let lockUntil=0;
function goTo(id,set){
 const el=document.getElementById(id);if(!el)return;
 const nav=document.querySelector('nav');const h=nav?nav.offsetHeight:0;
 lockUntil=Date.now()+900;set&&set(id);
 window.scrollTo({top:Math.max(0,el.getBoundingClientRect().top+window.scrollY-h+1),behavior:'smooth'});}
function Nav(){
 const[a,setA]=useState('');
 useEffect(()=>{const f=()=>{if(Date.now()<lockUntil)return;
  const h=document.documentElement;const nav=document.querySelector('nav');const off=(nav?nav.offsetHeight:0)+Math.round(innerHeight*.25);
  if(innerHeight+scrollY>=h.scrollHeight-4){setA(SECS[SECS.length-1]);return}
  let cur='';SECS.forEach(s=>{const el=document.getElementById(s);if(el&&el.getBoundingClientRect().top<=off)cur=s});setA(cur)};
  addEventListener('scroll',f,{passive:true});f();return()=>removeEventListener('scroll',f)},[]);
 return html`<nav aria-label="Main"><div className="wrap"><a href="#top" className=${a===''?'on':''} onClick=${e=>{e.preventDefault();lockUntil=Date.now()+900;setA('');window.scrollTo({top:0,behavior:'smooth'})}}>Home</a>${SECS.map(s=>html`<a key=${s} href=${'#'+s} className=${a===s?'on':''} onClick=${e=>{e.preventDefault();goTo(s,setA)}}>${s[0].toUpperCase()+s.slice(1)}</a>`)}</div></nav>`}

function Typed({words}){
 const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const[w,setW]=useState(0);const[n,setN]=useState(still?words[0].length:0);const[del,setDel]=useState(false);
 useEffect(()=>{if(still)return;const full=words[w];let d=del?28:55;
  if(!del&&n===full.length)d=1800;else if(del&&n===0)d=350;
  const t=setTimeout(()=>{
   if(!del&&n===full.length)setDel(true);
   else if(del&&n===0){setDel(false);setW((w+1)%words.length)}
   else setN(n+(del?-1:1))},d);
  return()=>clearTimeout(t)},[n,del,w]);
 return html`<span aria-label=${words[0]}>${words[w].slice(0,n)}<span className="cursor"></span></span>`}

function Terminal(){
 const[n,setN]=useState(0);
 useEffect(()=>{if(n<TESTS.length){const t=setTimeout(()=>setN(n+1),n?800:1200);return()=>clearTimeout(t)}},[n]);
 return html`<div className="run" aria-label="Sample test run">
  <div className="dim">$ pytest --alluredir=report</div>
  ${TESTS.map((t,i)=>i<=n&&html`<div className="row" key=${t}><span>${t}</span>${i<n?html`<span className="g">PASSED</span>`:html`<span className="dim spin">running</span>`}</div>`)}
  <hr/>
  <div>${n>=TESTS.length?html`<span className="g">4 passed</span> <span className="dim">0 failed</span>`:html`<span className="dim">collecting...</span>`}</div>
  <button className="rerun" onClick=${()=>setN(0)}>Run again</button></div>`}

function Skills(){
 const[t,setT]=useState('All');const keys=['All',...Object.keys(SK)];
 const list=t==='All'?Object.values(SK).flat():SK[t];
 return html`<div><div className="tabs" role="tablist">${keys.map(k=>html`<button key=${k} role="tab" aria-selected=${t===k} className=${'tab'+(t===k?' on':'')} onClick=${()=>setT(k)}>${k}</button>`)}</div>
  <div className="pills">${list.map((s,i)=>html`<span className="pill" key=${t+s} style=${{animationDelay:i*35+'ms'}}>${s}</span>`)}</div></div>`}

function Job({j,first}){

 return html`<div className=${'job'+(o?' open':'')}>
  <button className="jh" aria-expanded=${o} onClick=${()=>setO(!o)}><span><h3>${j.t}</h3><span className="meta">${j.m}</span></span><span className="chev" aria-hidden="true">⌄</span></button>

function Card({p}){
 const mv=e=>{const r=e.currentTarget.getBoundingClientRect();e.currentTarget.style.setProperty('--x',e.clientX-r.left+'px');e.currentTarget.style.setProperty('--y',e.clientY-r.top+'px')};
 return html`<article className="proj" onMouseMove=${mv}><h3>${p[0]}</h3><p>${p[1]}</p><span className="stack">${p[2]}</span></article>`}

function CopyEmail(){
 const[c,setC]=useState(false);
 const f=()=>{try{navigator.clipboard.writeText('pygdwt@gmail.com').catch(()=>{})}catch(e){}setC(true);setTimeout(()=>setC(false),1800)};
 return html`<button className="btn alt" onClick=${f}>${c?'Copied':'Copy email'}</button>`}

function ScrollFab(){
 const[down,setDown]=useState(true);
 useEffect(()=>{const f=()=>setDown(window.scrollY<200);addEventListener('scroll',f,{passive:true});f();return()=>removeEventListener('scroll',f)},[]);
 const go=()=>{lockUntil=Date.now()+900;window.scrollTo({top:down?document.documentElement.scrollHeight:0,behavior:'smooth'})};
 return html`<button className="fab" onClick=${go} aria-label=${down?'Scroll to bottom':'Scroll to top'} title=${down?'Scroll to bottom':'Scroll to top'}>
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style=${{transform:down?'rotate(180deg)':'none',transition:'transform .3s'}}><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>`}
